name: build_test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_test:
    timeout-minutes: 40
    strategy:
      # If macos-latest fails, we still don't want to cancel ubuntu-latest or the other way around.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        kind: [debug]
        include:
          # On linux also build and test release.
          - os: ubuntu-latest
            kind: release

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Install jsvu
        run: npm install jsvu -g
      - name: Install d8
        run: jsvu --os=default --engines=v8
      - name: d8 version
        run: ~/.jsvu/engines/v8/v8 --version
      # TODO(mliedtke): This is too slow in comparison to its limited benefit. Decide what to do
      # with it, either drop it or find a better way of testing this.
      #
      # - name: Install Binaryen
      #   run: |
      #     Tools/bootstrap-binaryen.sh ~/.binaryen
      #     echo "$HOME/.binaryen/bin" >> $GITHUB_PATH
      - name: Install Node.js dependencies for Compiler/Parser tests
        working-directory: ./Sources/Fuzzilli/Compiler/Parser
        run: npm install
      - uses: actions/setup-node@v7
        with:
          node-version: 27-nightly
      - name: V8 version used by Node.js
        run: node -p process.versions.v8
      - name: Swift Version
        run: swift --version
      - name: Build
        run: swift build -c ${{ matrix.kind }}
      - name: Install protobuf
        # Install protoc so the presubmit can also validate the generated *.pb.swift files.
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.kind == 'debug' }}
        run: sudo apt update && sudo apt install -y protobuf-compiler
      - name: Run presubmit checks
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.kind == 'debug' }}
        run: python3 Tools/presubmit.py
      - name: Run tests with Node.js
        run: Tools/run_tests.py Tests/failing_nodejs.txt -c ${{ matrix.kind }} --no-parallel
      - name: Run tests with d8
        run: FUZZILLI_TEST_SHELL=~/.jsvu/engines/v8/v8 Tools/run_tests.py Tests/failing_jsvu.txt -c ${{ matrix.kind }} --no-parallel

  windows_build_test:
    timeout-minutes: 60
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7
      - name: Install Swift 6.4.0
        uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057 # v0.5.0
        with:
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build and run focused Swift tests
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          if errorlevel 1 exit /b 1
          swift --version
          if errorlevel 1 exit /b 1
          swift build -j 4
          if errorlevel 1 exit /b 1
          swift run --skip-build FuzzilliCli --help >nul
          if errorlevel 1 exit /b 1
          node --version
          if errorlevel 1 exit /b 1
          swift test -j 4 --filter TestUtilsTests.testJavaScriptExecutorLargeOutput
          if errorlevel 1 exit /b 1
      - name: Run Windows REPRL transport smoke test
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          if errorlevel 1 exit /b 1
          cl /nologo /std:c11 /W4 /WX /utf-8 /I "Sources\libreprl\include" ^
            Sources\libreprl\libreprl-windows.c Tests\WindowsREPRLSmoke.c ^
            /Fe:WindowsREPRLSmoke.exe
          if errorlevel 1 exit /b 1
          WindowsREPRLSmoke.exe
          if errorlevel 1 exit /b 1
      - name: Install MSYS2 UCRT64 for QuickJS
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-clang
      - name: Build patched QuickJS
        shell: msys2 {0}
        run: |
          git clone https://github.com/bellard/quickjs.git quickjs
          cd quickjs
          git checkout "$(tr -d '\r\n' < ../Targets/QJS/REVISION)"
          git apply ../Targets/QJS/Patches/Fuzzilli-instrumentation-for-QJS.patch
          make CONFIG_WIN32=y CROSS_PREFIX= CONFIG_LTO= qjs.exe
      - name: Run QuickJS REPRL and fuzzing checks
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:Path = "$env:MSYS2_LOCATION\ucrt64\bin;$env:Path"
          $reprlOutput = '' | swift run --skip-build REPRLRun .\quickjs\qjs.exe --reprl 2>&1
          $reprlOutput | Select-String 'Running REPRL tests|All tests passed|Not all tests passed'
          $reprlText = $reprlOutput -join "`n"
          if ($LASTEXITCODE -ne 0 -or $reprlText -notmatch 'All tests passed!') {
            throw 'QuickJS REPRL tests failed'
          }
          $fuzzOutput = swift run --skip-build FuzzilliCli --profile=qjs --maxIterations=20 .\quickjs\qjs.exe 2>&1
          $fuzzOutput | Select-String 'Coverage|Startup tests finished|Total Samples|Fuzzer Finished'
          $fuzzText = $fuzzOutput -join "`n"
          if ($LASTEXITCODE -ne 0 -or $fuzzText -notmatch 'Startup tests finished successfully'
              -or $fuzzText -notmatch 'Total Samples:\s+20') {
            throw 'QuickJS fuzzing check failed'
          }

  asan:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install jsvu
        run: npm install jsvu -g
      - name: Install d8
        run: jsvu --os=default --engines=v8
      - name: d8 version
        run: ~/.jsvu/engines/v8/v8 --version
      # TODO(mliedtke): This is too slow in comparison to its limited benefit. Decide what to do
      # with it, either drop it or find a better way of testing this.
      #
      # - name: Install Binaryen
      #   run: |
      #     Tools/bootstrap-binaryen.sh ~/.binaryen
      #     echo "$HOME/.binaryen/bin" >> $GITHUB_PATH
      - name: Swift Version
        run: swift --version
      - name: Install LLVM
        run: sudo apt update && sudo apt install -y llvm
      - name: Run tests with leak sanitization
        run: |
          set -o pipefail
          export ASAN_SYMBOLIZER_PATH=$(which llvm-symbolizer)
          export FUZZILLI_TEST_SHELL=~/.jsvu/engines/v8/v8
          export ASAN_OPTIONS=detect_leaks=1
          export LSAN_OPTIONS=suppressions=$PWD/Tests/lsan_suppressions.txt
          swift test --sanitize=address --no-parallel 2>&1 | swift demangle
